name: Frontend CI/CD

on:
  push:
    branches:
      - dev
    paths:
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/frontend-cicd.yml'
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rsync
        run: sudo apt-get update -y && sudo apt-get install -y rsync

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Sync frontend
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync -az --delete \
            --exclude 'node_modules' \
            --exclude 'frontend/dist' \
            --exclude '.git' \
            ./frontend/ "$SSH_USER@$SSH_HOST:~/simvex/frontend/"
          rsync -az docker-compose.yml "$SSH_USER@$SSH_HOST:~/simvex/docker-compose.yml"

      - name: Deploy frontend
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" "sudo flock -w 300 /var/lock/simvex-docker-prune.lock -c 'docker system prune -af' && cd ~/simvex && sudo docker compose up -d --build --no-deps frontend"
