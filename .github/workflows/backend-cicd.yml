name: Backend CI/CD

on:
  push:
    branches:
      - dev
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-cicd.yml'
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rsync
        run: sudo apt-get update -y && sudo apt-get install -y rsync

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Sync backend
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync -az --delete \
            --exclude 'backend/data' \
            --exclude 'backend/assets' \
            --exclude '.git' \
            ./backend/ "$SSH_USER@$SSH_HOST:~/simvex/backend/"
          rsync -az docker-compose.yml "$SSH_USER@$SSH_HOST:~/simvex/docker-compose.yml"

      - name: Write env and deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_ADDR: ${{ secrets.REDIS_ADDR }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_DB: ${{ secrets.REDIS_DB }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          NOTION_TOKEN_KEY: ${{ secrets.NOTION_TOKEN_KEY }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          SESSION_COOKIE_NAME: ${{ secrets.SESSION_COOKIE_NAME }}
          COOKIE_SECURE: ${{ secrets.COOKIE_SECURE }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" "sudo flock -w 300 /var/lock/simvex-docker-prune.lock -c 'docker system prune -af || true' && cd ~/simvex && printf 'OPENAI_API_KEY=%s\nOPENAI_MODEL=%s\nDATABASE_URL=%s\nREDIS_ADDR=%s\nREDIS_PASSWORD=%s\nREDIS_DB=%s\nSMTP_HOST=%s\nSMTP_PORT=%s\nSMTP_USER=%s\nSMTP_PASS=%s\nSMTP_FROM=%s\nNOTION_TOKEN_KEY=%s\nNOTION_PARENT_PAGE_ID=%s\nSESSION_COOKIE_NAME=%s\nCOOKIE_SECURE=%s\nCORS_ALLOWED_ORIGINS=%s\n' \"$OPENAI_API_KEY\" \"$OPENAI_MODEL\" \"$DATABASE_URL\" \"$REDIS_ADDR\" \"$REDIS_PASSWORD\" \"$REDIS_DB\" \"$SMTP_HOST\" \"$SMTP_PORT\" \"$SMTP_USER\" \"$SMTP_PASS\" \"$SMTP_FROM\" \"$NOTION_TOKEN_KEY\" \"$NOTION_PARENT_PAGE_ID\" \"$SESSION_COOKIE_NAME\" \"$COOKIE_SECURE\" \"$CORS_ALLOWED_ORIGINS\" > .env && sudo docker compose up -d --build backend redis"
