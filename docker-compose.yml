services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - simvex-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - GIN_MODE=release
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL}
      - ASSET_IMPORT_PATH=/app/assets/models
    volumes:
      - ./backend/assets:/app/assets:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - simvex-network
    restart: unless-stopped

networks:
  simvex-network:
    driver: bridge
