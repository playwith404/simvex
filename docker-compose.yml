services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - simvex-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - GIN_MODE=release
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL}
      - ASSET_IMPORT_PATH=/app/assets/models
      - REDIS_ADDR=${REDIS_ADDR:-redis:6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - NOTION_TOKEN_KEY=${NOTION_TOKEN_KEY}
      - SESSION_COOKIE_NAME=${SESSION_COOKIE_NAME:-simvex_session}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    volumes:
      - ./backend/assets:/app/assets:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - simvex-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - simvex-network
    restart: unless-stopped

networks:
  simvex-network:
    driver: bridge
